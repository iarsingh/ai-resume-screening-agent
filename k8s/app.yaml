apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-resume-screening-agent
  labels:
    app: ai-resume-screening-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-resume-screening-agent
  template:
    metadata:
      labels:
        app: ai-resume-screening-agent
    spec:
      containers:
        - name: api
          image: ai-resume-screening-agent:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ai-resume-screening-agent
spec:
  selector:
    app: ai-resume-screening-agent
  ports:
    - port: 80
      targetPort: 8080
